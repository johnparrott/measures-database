<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Psychological Measures Search</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<style>
  :root{
    --ink:#000;
    --muted:#686868;
    --line:#d9d9d9;
    --bg:#fff;
    --surface:#fff;
    --surface-soft:#f5f5f5;
    --surface-pill:#f1f1f1;
    --text-soft:#232323;
    --control:#111;
    --page-x:48px;
    --left-col:28.1%;
    --results-top:416px;
    --filter-width:300px;
    --filter-gutter:46px;
    --nav-h:74px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input{font:inherit}
  .page{width:100%;height:calc(100vh - var(--nav-h));padding:0 var(--page-x);overflow:hidden}

  .site-nav{
    height:var(--nav-h);display:flex;align-items:center;border-bottom:1px solid var(--line);
    padding:0 var(--page-x);background:var(--surface);position:relative;z-index:8;
  }
  .site-brand{display:inline-flex;align-items:center;gap:13px;text-decoration:none;color:inherit;min-width:0}
  .site-brand-logo{width:40px;height:40px;object-fit:contain;display:block;flex:0 0 40px}
  .site-brand-name{font-size:17px;line-height:1.15;font-weight:600;letter-spacing:-.025em;white-space:nowrap}

  .search-hero{
    height:244px;
    display:flex;
    align-items:flex-end;
    padding:0 0 35px;
    border-bottom:1px solid var(--line);
  }
  .search-shell{position:relative;width:100%;z-index:5}
  .search-input{
    width:100%;
    border:0;
    outline:0;
    padding:0 64px 0 92px;
    background:transparent;
    color:var(--ink);
    font-size:64px;
    line-height:.98;
    letter-spacing:-0.055em;
    font-weight:400;
  }
  .search-input::placeholder{color:#b8b8b8;opacity:1}
  .search-input::-webkit-search-cancel-button{
    -webkit-appearance:none;
    appearance:none;
    display:none;
  }
  .search-input::-webkit-search-decoration{
    -webkit-appearance:none;
  }
  .search-icon{
    position:absolute;left:0;bottom:4px;
    width:58px;height:58px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;
  }
  .search-icon svg{width:50px;height:50px;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
  .search-clear{position:absolute;right:0;bottom:10px;width:44px;height:44px;border:0;background:transparent;padding:0;display:none;place-items:center;cursor:pointer;color:#6b6b6b;border-radius:999px}
  .search-clear.on{display:grid}
  .search-clear:hover{background:#f2f2f2;color:#111}
  .search-clear svg{width:22px;height:22px;stroke-width:1.45;stroke-linecap:round}
  .suggestions-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}
  .suggestions-title{font-size:16px;line-height:1.3;color:#5f5f5f;margin:0;font-weight:600}
  .escape-hint{display:flex;align-items:center;gap:7px;color:#8a8a8a;font-size:12px;line-height:1}
  .escape-hint kbd{font-family:inherit;font-size:11px;font-weight:500;line-height:1;padding:5px 6px;border:1px solid #d8d8d8;border-radius:6px;background:#fafafa;box-shadow:0 1px 0 rgba(0,0,0,.04);color:#666}


  .suggestions{
    position:absolute;
    left:calc(50% - 50vw);
    width:100vw;
    top:calc(100% + 30px);
    background:var(--surface);
    padding:56px var(--page-x);
    border-bottom:1px solid var(--line);
    height:0;
    opacity:0;
    overflow:hidden;
    visibility:hidden;
    pointer-events:none;
    transform:translateY(-10px);
    transform-origin:top;
    transition:height .34s cubic-bezier(.22,.8,.22,1), opacity .2s ease, transform .34s cubic-bezier(.22,.8,.22,1), visibility 0s linear .34s;
  }
  .suggestions.on{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:translateY(0);
    overflow:hidden;
    transition:height .42s cubic-bezier(.22,.8,.22,1), opacity .2s ease, transform .42s cubic-bezier(.22,.8,.22,1), visibility 0s;
  }
  .suggestions-backdrop{
    position:fixed;left:0;right:0;top:calc(var(--nav-h) + 244px);bottom:0;z-index:4;
    opacity:0;pointer-events:none;
    background:rgba(0,0,0,.48);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    transition:opacity .18s ease;
  }
  .suggestions-backdrop.on{opacity:1;pointer-events:auto;cursor:pointer}
  .suggestion-group + .suggestion-group{margin-top:34px}
  .suggestion-group-title{font-size:14px;line-height:1.3;color:#6f6f6f;margin:0 0 9px;padding:0 12px;font-weight:600}
  .did-you-mean .suggestion-group-title{color:#5f5f5f}
  .did-you-mean .suggestion-item{background:#f5f5f5}
  .suggestion-item{
    width:100%;height:48px;border:0;background:transparent;border-radius:10px;
    display:flex;align-items:center;gap:16px;padding:0 16px;cursor:pointer;text-align:left;
    color:#666;font-size:15px;font-weight:500;letter-spacing:-.015em;
  }
    .suggestion-item:hover{background:#f5f5f5;color:#202020}
  .suggestion-item svg{width:18px;height:18px;flex:0 0 18px;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .suggestion-item .suggestion-label{min-width:0;flex:1}
  .suggestion-count{margin-left:auto;color:#9a9a9a;font-size:13px;font-weight:500;line-height:1;flex:0 0 auto}
  .suggestion-item:hover .suggestion-count{color:#707070}
  .suggestion-item.recent-item .suggestion-label{flex:0 1 auto}
  .recent-remove{margin-left:4px;width:28px;height:28px;flex:0 0 28px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:#8a8a8a;padding:0}
  .recent-remove:hover{background:#e9e9e9;color:#1d1d1f}
  .recent-remove svg{width:13px;height:13px;stroke-width:1.6}
  .suggestion-label{font-weight:500;color:#777}
  .suggestion-match{font-weight:700;color:#1d1d1f}
  .suggestion-item:hover .suggestion-label{color:#666}

  .control-row{
    height:98px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:28px;
    border-bottom:1px solid var(--line);
  }
  .control-left{display:flex;align-items:flex-start;gap:18px;min-width:0;flex-wrap:wrap}
  .control-actions{display:flex;align-items:center;gap:46px;flex:0 0 auto}
  .sort-wrap{display:inline-flex;align-items:center;gap:10px;height:42px;color:#111}
  .sort-prefix{font-size:16px;font-weight:500;color:#111;white-space:nowrap}
  .sort-segments{position:relative;display:inline-flex;align-items:center;gap:16px;height:100%}
  .sort-segment{position:relative;border:0;background:transparent;color:#777;padding:0 0 3px;font-size:16px;font-weight:500;cursor:pointer;transition:color .18s ease}
  .sort-segment:hover{color:#111}
  .sort-segment.active{color:#111}
  .sort-segment:focus-visible{outline:2px solid #111;outline-offset:4px;border-radius:2px}
  .sort-indicator{position:absolute;left:0;bottom:5px;height:1.5px;background:#111;width:0;transform:translateX(0);transition:transform .28s cubic-bezier(.22,.8,.22,1),width .28s cubic-bezier(.22,.8,.22,1)}
  .result-status{display:none;flex-direction:column;align-items:flex-start;gap:12px;min-width:0}
  .result-status.on{display:flex}
  .results-status-block{padding:30px 0 28px;border-bottom:1px solid var(--line)}
  .filter-btn{
    position:relative;
    display:inline-flex;align-items:center;gap:9px;height:42px;
    margin:0;
    padding:0 16px;border:1.5px solid #111;background:#fff;cursor:pointer;border-radius:999px;
    font-size:16px;line-height:1;font-weight:500;color:var(--ink);
    overflow:visible;
    transition:border-color .18s ease, background .18s ease,color .18s ease;
  }
  .filter-btn:hover{border-color:#111;background:#fafafa}
  .filter-btn svg{width:17px;height:17px;stroke-width:1.8;stroke:currentColor}
  .filter-count{
    display:none;align-items:center;justify-content:center;
    position:absolute;top:-11px;right:-11px;
    width:28px;height:28px;min-width:28px;padding:0;
    border-radius:50%;background:#111;color:#fff;
    border:3px solid #fff;box-sizing:border-box;
    font-size:12px;font-weight:700;line-height:1;
    z-index:2;
  }
  .filter-count.on{display:flex}
  .filter-btn[aria-expanded="true"] .filter-count{background:#111;color:#fff}
  .filter-btn[aria-expanded="true"]{font-weight:600;background:#111;color:#fff;border-color:#111}
  .result-count{font-size:16px;line-height:1.2;color:var(--muted)}
  .result-count strong{font-weight:600;color:#171717}
  .search-summary{display:none;font-size:13px;line-height:1.3;color:#888;letter-spacing:-.008em}
  .search-summary.on{display:block}
  .search-summary .did-you-mean-inline{color:#888}
  .search-summary .did-you-mean-inline button{border:0;background:transparent;padding:0;margin-left:5px;font:inherit;font-weight:600;color:#555;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
  .search-summary .did-you-mean-inline button:hover{opacity:.6}


  .results{width:100%;height:calc(100vh - var(--results-top));overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;transition:margin-left .34s cubic-bezier(.22,.8,.22,1),width .34s cubic-bezier(.22,.8,.22,1)}
  body.filters-open .results{margin-left:calc(var(--filter-width) + var(--filter-gutter));width:calc(100% - var(--filter-width) - var(--filter-gutter))}
  .result{
    position:relative;
    display:grid;
    grid-template-columns:var(--left-col) 1fr;
    border-bottom:1px solid var(--line);
    padding:44px 48px 44px 0;
    text-decoration:none;
    color:inherit;
    transition:border-color .18s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .measure-title-link:hover .measure-title{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
  }
  .meta{padding-right:40px;transition:transform .2s cubic-bezier(.22,.8,.22,1)}
  .measure{padding-right:0;max-width:760px;transition:transform .2s cubic-bezier(.22,.8,.22,1)}
  .construct{font-size:15px;line-height:1.28;font-weight:600;letter-spacing:-.015em;margin-bottom:14px}
  .date{font-size:14px;line-height:1.35;color:var(--muted);letter-spacing:-.01em;font-weight:500}
  .measure-title{font-size:24px;line-height:1.14;font-weight:600;letter-spacing:-.034em;margin:0 0 14px;max-width:720px}
  .measure-title-link{color:inherit;text-decoration:none;display:inline-block;cursor:pointer}
  .measure-desc-wrap{max-width:560px}
  .measure-desc{font-size:16px;line-height:1.46;font-weight:400;letter-spacing:-.015em;margin:0;color:#232323;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .measure-desc.expanded{display:block;overflow:visible}
  .measure-desc.animating{display:block;-webkit-line-clamp:unset;overflow:hidden;will-change:height,opacity}
  .abstract-more{border:0;background:transparent;padding:0;margin:5px 0 0;font:inherit;font-size:14px;line-height:1.3;font-weight:650;color:#111;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .abstract-more:hover{color:#000}
  .abstract-more i{font-size:13px;line-height:1;transition:transform .2s ease}
  .abstract-more[aria-expanded="true"] i{transform:rotate(180deg)}
  .abstract-more[hidden]{display:none}
  .measure-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
  .measure-pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;background:#f1f1f1;color:#6f6f6f;font-size:13px;line-height:1;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
  .measure-pill-icon{width:14px;height:14px;display:grid;place-items:center;flex:0 0 14px;color:#777;font-size:14px;line-height:1}
  .measure-pill-icon i{display:block;font-size:14px;line-height:1}
  .measure-pill-number{font-weight:700;color:#555}

  .load-more-wrap{display:none;justify-content:center;padding:34px 0 10px}
  .load-more-wrap.on{display:flex}
  .load-more-btn{height:44px;border:0;border-radius:999px;background:#111;color:#fff;padding:0 20px;font:inherit;font-size:14px;line-height:1;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:background .18s ease,transform .18s ease}
  .load-more-btn:hover{background:#2a2a2a}
  .load-more-btn:active{transform:scale(.98)}

  .empty{display:none;padding:56px 0 72px;border-bottom:1px solid var(--line)}
  .empty-headline{font-size:30px;line-height:1.12;font-weight:600;letter-spacing:-.035em;max-width:900px;margin:0 0 14px}
  .empty-sub{font-size:42px;line-height:1.08;font-weight:600;letter-spacing:-.045em;color:#1d1d1f;max-width:720px;margin:0}
  .empty-section{margin-top:54px}
  .empty-section-title{font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-.025em;margin:0 0 22px}
  .empty-suggestions{display:flex;flex-wrap:wrap;gap:10px;max-width:900px}
  .empty-search-chip{height:42px;border:1px solid #d8d8d8;border-radius:999px;background:#fff;padding:0 16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;font-size:14px;font-weight:500;color:#292929;transition:border-color .16s ease,color .16s ease}
  .empty-search-chip:hover{border-color:#aaa;color:#111}
  .empty-search-chip i{font-size:15px;color:#858585}
  .empty-search-count{color:#8a8a8a;font-size:13px;font-weight:500;margin-left:2px}
  .empty-reset{margin-top:28px;height:42px;border:1px solid #111;border-radius:999px;background:#111;color:#fff;padding:0 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .empty-reset:hover{background:#262626}
  @media(max-width:760px){.empty-headline{font-size:26px}.empty-sub{font-size:34px;max-width:100%}}
  .results::after{content:"";display:block;height:48px}

  .scrim{display:none}
  .drawer{
    position:fixed;top:var(--results-top);left:var(--page-x);bottom:0;width:var(--filter-width);background:var(--surface);z-index:3;
    transform:translateX(calc(-100% - var(--page-x) - 2px));transition:transform .34s cubic-bezier(.22,.8,.22,1), visibility 0s linear .34s;visibility:hidden;
    padding:20px var(--filter-gutter) 28px 0;display:flex;flex-direction:column;overflow-y:auto;
    border-right:1px solid #e8e8e8;
  }
  .drawer.on{transform:translateX(0);visibility:visible;transition:transform .34s cubic-bezier(.22,.8,.22,1), visibility 0s}
  .facet-sections{display:flex;flex-direction:column}
  .facet-section{padding:24px 0;border-top:1px solid #eeeeee}
  .facet-section:first-child{border-top:0;padding-top:24px}
  .facet-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0;border:0;background:transparent;cursor:pointer;text-align:left}
  .facet-title{font-size:15px;line-height:1.2;font-weight:600;letter-spacing:-.015em;color:#111}
  .facet-chevron{width:18px;height:18px;color:#a1a1a1;transition:transform .22s ease}
  .facet-chevron svg{width:100%;height:100%;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .facet-section.collapsed .facet-chevron{transform:rotate(180deg)}
  .facet-body{overflow:hidden;transition:grid-template-rows .25s ease,opacity .22s ease,margin-top .25s ease;margin-top:16px;display:grid;grid-template-rows:1fr;opacity:1}
  .facet-section.collapsed .facet-body{grid-template-rows:0fr;opacity:0;margin-top:0}
  .facet-body-inner{min-height:0}
  .facet-chip-grid{display:flex;flex-wrap:wrap;gap:10px}
  .age-chip-grid{display:flex;flex-wrap:wrap;gap:10px}
  .age-chip{min-height:38px;border:1px solid #dedede;background:#fff;color:#444;border-radius:999px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;line-height:1;font-weight:500;letter-spacing:-.01em;transition:background .18s ease,color .18s ease,border-color .18s ease}
  .age-chip:hover{border-color:#c7c7c7;color:#111}
  .age-chip.active{background:#111;color:#fff;border-color:#111}
  .age-chip-icon{width:17px;height:17px;display:grid;place-items:center;flex:0 0 17px}
  .age-chip-icon i{font-size:17px;line-height:1}
  .language-glyph{width:17px;height:17px;display:grid;place-items:center;flex:0 0 17px;color:#111;font-size:13px;font-weight:700;line-height:1}
  .facet-chip{
    min-height:38px;border:1px solid #dedede;background:#fff;color:#444;border-radius:999px;
    padding:0 13px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    font-size:13px;line-height:1;font-weight:500;letter-spacing:-.01em;transition:border-color .18s ease,box-shadow .18s ease,color .18s ease;
  }
  .facet-chip:hover{border-color:#c7c7c7;color:#111}
  .facet-chip.active{border-color:#111;background:#111;color:#fff;box-shadow:none}
  .facet-chip.active .facet-chip-icon,.facet-chip.active .language-glyph{color:#fff}
  .facet-chip:disabled{opacity:.35;cursor:default}
  .facet-chip-icon{width:17px;height:17px;display:grid;place-items:center;flex:0 0 17px;color:#111}
  .facet-chip-icon svg{display:block;width:17px;height:17px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .facet-chip.any{padding:0 14px}
  .facet-chip.any .facet-chip-icon{display:none}
  .filter-footer{margin-top:24px;padding-top:18px;border-top:1px solid #e8e8e8;display:flex;gap:10px;width:100%}
  .filter-footer button{height:40px;border-radius:999px;padding:0 16px;font-size:13px;font-weight:600;letter-spacing:-.01em;cursor:pointer}
  .filter-reset{border:1px solid #d8d8d8;background:#fff;color:#333}
  .filter-reset:hover{border-color:#bdbdbd;color:#111}
  .filter-apply{border:1px solid #111;background:#111;color:#fff;flex:1}
  .filter-apply:hover{background:#242424;border-color:#242424}

  @media (max-width:900px){
    :root{--page-x:22px;--left-col:35%;--results-top:352px;--nav-h:64px}
    .search-hero{height:190px;padding-bottom:28px}
    .suggestions-backdrop{top:calc(var(--nav-h) + 190px)}
    .search-input{font-size:46px}
    .result{padding:38px 0}
    .measure{padding-right:0}
    .measure-title{font-size:22px}
  }
  @media (max-width:900px){
    :root{--filter-width:280px;--filter-gutter:32px}
  }
  @media (max-width:620px){
    .site-brand{gap:10px}
    .site-brand-logo{width:34px;height:34px;flex-basis:34px}
    .site-brand-name{font-size:15px;white-space:normal}
    .search-hero{height:158px}
    .suggestions-backdrop{top:calc(var(--nav-h) + 158px)}
    .search-input{font-size:38px;padding:0 52px 0 64px}
    .search-icon{width:42px;height:42px;bottom:0}.search-icon svg{width:36px;height:36px;stroke-width:1.15}
    .search-clear{right:0;bottom:1px;width:38px;height:38px}.search-clear svg{width:19px;height:19px}
    .suggestions{top:calc(100% + 24px)}.suggestion-item{font-size:14px;height:44px;padding:0 12px;gap:13px}
    :root{--results-top:294px}
    :root{--filter-width:min(280px,88vw);--filter-gutter:24px}
    .drawer-title{font-size:20px}

  .control-row{height:72px}
    .result{grid-template-columns:1fr;gap:20px;padding:30px 36px 30px 0}
    .result::after{right:4px}
    .meta{padding-right:0}.construct{font-size:14px}.date{font-size:13px}
    .measure-title{font-size:21px}.measure-desc{font-size:15px}.measure-meta{gap:8px;margin-top:28px}.measure-pill{min-height:26px;padding:0 9px;font-size:12px}
  }


  /* Measure detail view */
  .detail-view{display:none;position:fixed;inset:var(--nav-h) 0 0;background:#fff;z-index:80;overflow:auto}
  body.detail-open{overflow:hidden}
  body.detail-open .detail-view{display:block}
  .detail-shell{max-width:1240px;margin:0 auto;padding:34px var(--page-x) 96px}
  .detail-back{border:0;background:transparent;padding:8px 0;margin:0 0 34px;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:600;color:#333;cursor:pointer}
  .detail-back:hover{color:#000}
  .detail-back i{font-size:16px}
  .detail-hero{display:block;padding:150px 0;max-width:980px;margin:0 auto;text-align:center}
  .detail-hero-left,.detail-hero-right{min-width:0}
    .detail-title{font-size:76px;line-height:.96;letter-spacing:-.055em;font-weight:600;max-width:780px;margin:0 auto}
  .detail-abstract-label{display:none}
    .detail-meta-row{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin-top:28px}

</script><script>
  const measureData = Array.isArray(window.MEASURES) ? window.MEASURES : [];
  const resultsMount = document.getElementById('results');
  const emptyState = document.getElementById('empty');

  function escapeAttr(value){
    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/"/g,'&quot;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  function escapeText(value){
    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  const ITEM_WORDS = {
    one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
    eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,
    twenty:20,thirty:30,forty:40,fifty:50
  };

  function extractItemCount(item){
    const explicit = item.item_count ?? item.itemCount ?? item.items_count;
    if(explicit !== null && explicit !== undefined && explicit !== ''){
      const n = Number(explicit);
      if(Number.isFinite(n) && n > 0) return n;
    }
    const source = `${item.name || ''} ${item.description || ''}`.toLowerCase();
    const numeric = source.match(/\b(\d+)\s*[- ]?item\b/);
    if(numeric) return Number(numeric[1]);
    const word = source.match(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty)\s+item\b/);
    if(word) return ITEM_WORDS[word[1]] || null;
    return null;
  }

  function deriveAge(item){
    const text = normalizeText(`${item.name} ${item.description} ${item.search_text}`);
    if(/older adult|older people|elderly|geriatric|ageing|aging/.test(text)) return ['65+'];
    if(/baby|infant|toddler/.test(text)) return ['0–2'];
    if(/preschool|early childhood/.test(text)) return ['3–5'];
    if(/child version|children|child|school age/.test(text)) return ['3–5','6–11'];
    if(/adolescent|teen|youth/.test(text)) return ['12–17'];
    if(/young adult|college|university student/.test(text)) return ['18–25'];
    if(/adult|romantic relationship|workplace|employee/.test(text)) return ['18–25','26–39','40–64'];
    return ['0–2','3–5','6–11','12–17','18–25','26–39','40–64','65+'];
  }

  function derivePopulation(item){
    const text = normalizeText(`${item.name} ${item.description} ${item.search_text}`);
    if(/student|academic|school|university|teacher/.test(text)) return 'Students';
    if(/parent|parenting|caregiver|family/.test(text)) return 'Parents / caregivers';
    if(/workplace|employee|occupational|supervisor|coworker/.test(text)) return 'Workplace';
    if(/clinical|patient|ptsd|stress|anxiety|depression/.test(text)) return 'Clinical';
    return 'General population';
  }

  function deriveLanguage(item){
    const text = normalizeText(`${item.name} ${item.description} ${item.search_text}`);
    if(/arabic|arab/.test(text)) return 'Arabic';
    if(/spanish|espanol/.test(text)) return 'Spanish';
    if(/french|francais/.test(text)) return 'French';
    if(/german|deutsch/.test(text)) return 'German';
    if(/chinese|mandarin/.test(text)) return 'Chinese';
    if(/japanese/.test(text)) return 'Japanese';
    return item.language || 'English';
  }


  function deriveLength(item){
    const count = extractItemCount(item);
    if(count == null) return 'Unknown';
    if(count <= 10) return 'Short';
    if(count <= 25) return 'Medium';
    return 'Long';
  }

  const AUTHOR_MAP = {
    'Acceptance and Action Questionnaire (AAQ-II)': 'Bond et al.',
    'Achievement Goal Questionnaire-Revised (AGQ-R)': 'Elliot & Murayama',
    'Adult Autism Spectrum Quotient (AQ-10) — Self-administered': 'Allison et al.',
    'Meaning in Life Questionnaire (MLQ)': 'Steger et al.',
    'Psychological Well-Being Scale (SPWB)': 'Ryff',
    'Subjective Happiness Scale (SHS)': 'Lyubomirsky & Lepper',
    'PTSD Checklist 5 (PCL-5)': 'Weathers et al.',
    'Purpose in Life Test (PIL)': 'Crumbaugh & Maholick',
    'Abbreviated Technology Anxiety Scale (ATAS)': 'Rosen et al.',
    'ABC Connectedness to Nature Scale (ABC-CNS)': 'Pasca et al.',
    'Positive and Negative Affect Schedule (PANAS)': 'Watson et al.',
    'Relationship Assessment Scale (RAS)': 'Hendrick',
    'Satisfaction with Life Scale (SWLS)': 'Diener et al.',
    'Resilience Scale (RS)': 'Wagnild & Young',
    'Social Support Questionnaire (SSQ)': 'Sarason et al.',
    'UCLA Loneliness Scale': 'Russell et al.',
    'Emotion Regulation Questionnaire (ERQ)': 'Gross & John',
    'Hope Scale': 'Snyder et al.',
    'Toronto Empathy Questionnaire (TEQ)': 'Spreng et al.',
    'Gratitude Questionnaire — Six Item Form (GQ-6)': 'McCullough et al.'
  };

  const DEMO_AUTHOR_POOL = [
    'Smith et al.','Johnson et al.','Lee et al.','Brown et al.','Garcia et al.',
    'Wilson et al.','Anderson et al.','Martinez et al.','Taylor et al.','Clark et al.'
  ];

  function stableDemoNumber(value){
    let hash = 0;
    const str = String(value || '');
    for(let i=0;i<str.length;i++) hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
    return Math.abs(hash);
  }

  function deriveAuthor(item){
    return item.author || item.authors || AUTHOR_MAP[item.name] || DEMO_AUTHOR_POOL[stableDemoNumber(item.name) % DEMO_AUTHOR_POOL.length];
  }

  function itemCountNumber(item){
    const count = extractItemCount(item);
    const demoCount = [6,8,10,12,15,18,20,24,30,36,40][stableDemoNumber(item.name + 'items') % 11];
    return count == null ? demoCount : count;
  }

  function formatItemCount(item){
    const finalCount = itemCountNumber(item);
    return `${finalCount} ${finalCount === 1 ? 'item' : 'items'}`;
  }

  function citationNumber(item){
    const raw = item.citation_count ?? item.citations;
    if(raw !== null && raw !== undefined && raw !== '') return Number(raw) || 0;
    const year = Number(item.year);
    const ageBoost = Number.isFinite(year) ? Math.max(0, 2026 - year) * 42 : 420;
    return 45 + (stableDemoNumber(item.name + 'citations') % 1600) + ageBoost;
  }

  function formatCitationCount(item){
    return `${citationNumber(item).toLocaleString()} citations`;
  }

  const decoratedMeasures = measureData.map(item => ({
    ...item,
    meta: {
      citationNumber: citationNumber(item),
      citations: formatCitationCount(item),
      author: deriveAuthor(item),
      itemNumber: itemCountNumber(item),
      items: formatItemCount(item)
    },
    facets: {
      population: derivePopulation(item),
      age: deriveAge(item),
      instrument: deriveInstrumentType(item),
      administration: deriveAdministration(item),
      length: deriveLength(item),
      language: deriveLanguage(item)
    }
  }));

  function pillIcon(type){
    const icons = {
      citations:'<i class="ph-bold ph-quotes" aria-hidden="true"></i>',
      author:'<i class="ph-bold ph-user" aria-hidden="true"></i>',
      items:'<i class="ph-bold ph-list-numbers" aria-hidden="true"></i>'
    };
    return icons[type] || '';
  }

  function renderMeasureRows(){
    const markup = decoratedMeasures.map(item => {
      const searchText = item.search_text || [item.name,item.construct,item.description].filter(Boolean).join(' ');
      return `<article class="result" data-construct="${escapeAttr(item.construct)}" data-population="${escapeAttr(item.facets.population)}" data-age="${escapeAttr(item.facets.age.join('|'))}" data-instrument="${escapeAttr(item.facets.instrument)}" data-administration="${escapeAttr(item.facets.administration)}" data-length="${escapeAttr(item.facets.length)}" data-language="${escapeAttr(item.facets.language)}" data-citations="${escapeAttr(item.meta.citationNumber)}" data-text="${escapeAttr(searchText)}">
        <div class="meta"><div class="construct">${escapeText(item.construct)}</div><div class="date">${escapeText(item.year || '—')}</div></div>
        <div class="measure"><a class="measure-title-link" href="${escapeAttr(item.url)}" data-measure-name="${escapeAttr(item.name)}"><h2 class="measure-title">${escapeText(item.name)}</h2></a><div class="measure-desc-wrap"><p class="measure-desc">${escapeText(item.description)}</p><button type="button" class="abstract-more" hidden aria-expanded="false"><span class="abstract-more-label">Show more</span><i class="ph-bold ph-caret-down" aria-hidden="true"></i></button></div><div class="measure-meta"><span class="measure-pill" title="Prototype placeholder metadata"><span class="measure-pill-icon">${pillIcon('author')}</span>${escapeText(item.meta.author)}</span><span class="measure-pill" title="Prototype placeholder metadata"><span class="measure-pill-icon">${pillIcon('items')}</span><span><span class="measure-pill-number">${escapeText(item.meta.itemNumber)}</span> ${item.meta.itemNumber === 1 ? 'item' : 'items'}</span></span><span class="measure-pill" title="Prototype placeholder metadata"><span class="measure-pill-icon">${pillIcon('citations')}</span><span><span class="measure-pill-number">${escapeText(item.meta.citationNumber.toLocaleString())}</span> citations</span></span></div></div>
      </article>`;
    }).join('');
    resultsMount.insertAdjacentHTML('afterbegin', markup);
  }

  renderMeasureRows();

  const detailView = document.getElementById('detailView');
  const detailContent = document.getElementById('detailContent');
  const detailBack = document.getElementById('detailBack');
  let detailScrollHandler = null;

  const mlqDetail = {
    name:'Meaning in Life Questionnaire',
    authors:'Michael F. Steger, Patricia Frazier, Shigehiro Oishi, Marcel Kaler',
    year:'2006',
    abstract:[
      'The Meaning in Life Questionnaire (MLQ) is a 10-item measure developed to assess two distinct dimensions of meaning in life: Presence of Meaning and Search for Meaning. Presence reflects the extent to which people experience their lives as meaningful, purposeful, and significant, while Search reflects active efforts to find or deepen meaning. The measure uses a 7-point response format and is widely used in positive, existential, and clinical psychology research.'
    ],
    citation:'Steger, M. F., Frazier, P., Oishi, S., & Kaler, M. (2006). The meaning in life questionnaire: Assessing the presence of and search for meaning in life. Journal of Counseling Psychology, 53(1), 80–93. https://doi.org/10.1037/0022-0167.53.1.80',
    sourceUrl:'https://doi.org/10.1037/0022-0167.53.1.80',
    instruction:'Think briefly about what gives your life a sense of importance and significance. Respond to each statement as honestly and accurately as you can. These questions are subjective, so there are no right or wrong answers.',
    reverseItems:[9],
    subscales:{
      'Presence of Meaning':[1,4,5,6,9],
      'Search for Meaning':[2,3,7,8,10]

    items:[

      'I am always searching for something that makes my life feel significant.',

      'My life has no clear purpose.',
      'I am searching for meaning in my life.'
    ],
    scoring:[
      {title:'Presence of Meaning',text:'Sum items 1, 4, 5, 6, and 9. Item 9 is reverse-coded before calculating the subscale score.'},
      {title:'Search for Meaning',text:'Sum items 2, 3, 7, 8, and 10. Higher scores reflect a stronger active search for meaning.'}
    ],
    evidence:{
      presenceAlpha:'.82–.86',
      searchAlpha:'.86–.87',
      factor:'Two-factor structure',
      validity:[
        {type:'Convergent',text:'Presence relates positively to life satisfaction, positive emotion, and several indicators of psychological well-being.'},
        {type:'Discriminant',text:'Presence is distinguishable from related meaning measures and from Search for Meaning rather than collapsing into a single construct.'},
        {type:'Criterion',text:'',subtypes:[{title:'Concurrent',text:'Presence showed expected relationships with well-being and distress measures in the original validation studies.'},{title:'Predictive',text:'Predictive validity was not established in the original validation study.'}]}
      ]
    }
  };

  function detailFacts(item, isMlq){
    const age = (item.facets.age || [])[0] || '—';
    const population = Array.isArray(item.facets.population) ? item.facets.population.join(', ') : (item.facets.population || 'Population');
    const language = Array.isArray(item.facets.language) ? item.facets.language[0] : (item.facets.language || '—');
    return [
      {label:'Length', value:isMlq ? '10' : String(item.meta.itemNumber || '—'), sub:'Items'},
      {label:'Structure', value:isMlq ? '2' : '—', sub:'Subscales'},
      {label:'Response', value:isMlq ? '7-point' : '—', sub:'Response scale'},
      {label:'Age', value:isMlq ? '14+' : age, sub:'Age'},
      {label:'Language', value:isMlq ? 'EN' : language, sub:'Language'}
    ];
  }

  function relatedFor(item){
    const pool = decoratedMeasures.filter(x => x.name !== item.name);
    const same = pool.filter(x => x.construct === item.construct);
    const broader = pool.filter(x => /meaning|purpose|well-being|happiness|life satisfaction/i.test(`${x.construct} ${x.name}`));
    const seen = new Set();
    return [...same,...broader,...pool]
      .filter(x=>{if(seen.has(x.name)) return false;seen.add(x.name);return true})
      .sort((a,b)=>Number(Boolean(b.year))-Number(Boolean(a.year)))
      .slice(0,6);
  }


  function openMeasureDetail(item){
    const isMlq = /Meaning in Life Questionnaire/i.test(item.name);

    const about = d ? d.abstract : [item.description || ''];
    const citationText = d ? d.citation : `${item.meta.author}${item.year ? ` (${item.year})` : ''}. ${item.name}.`;
    const citationUrl = d ? d.sourceUrl : item.url;
    const related = relatedFor(item);
    detailContent.innerHTML = `

      <div class="detail-body">

        return best;

      const getVisibleRange=()=>{
        const trackRect=relatedTrack.getBoundingClientRect();
        const visible=relatedCards
          .map((card,i)=>({i,rect:card.getBoundingClientRect()}))
          .filter(({rect})=>rect.right>trackRect.left+8&&rect.left<trackRect.right-8)
          .map(({i})=>i);
        if(!visible.length){const i=getIndex();return {first:i,last:i};}
        return {first:visible[0],last:visible[visible.length-1]};
      };
      const updateRelatedNav=()=>{

        const edgeTolerance=5;
        relatedCards.forEach((card,i)=>{
          card.classList.remove('edge-divider-hidden');

          const dividerX=card.getBoundingClientRect().left;

  function setupAbstractPreviews(){
    const wraps = [...document.querySelectorAll('.measure-desc-wrap')];
    const refresh = () => wraps.forEach(wrap => {
      const desc = wrap.querySelector('.measure-desc');
      const more = wrap.querySelector('.abstract-more');
      if (!desc.classList.contains('expanded')) {
        more.hidden = !(desc.scrollHeight > desc.clientHeight + 1);
      }
    });
    wraps.forEach(wrap => {
      const desc = wrap.querySelector('.measure-desc');
      const more = wrap.querySelector('.abstract-more');
      const moreLabel = more.querySelector('.abstract-more-label');
      more.addEventListener('click', () => {
        const isExpanded = desc.classList.contains('expanded');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const hasGsap = typeof window.gsap !== 'undefined';

        more.hidden = false;

        if (reduceMotion || !hasGsap) {
          desc.classList.toggle('expanded', !isExpanded);
          moreLabel.textContent = isExpanded ? 'Show more' : 'Show less';
          more.setAttribute('aria-expanded', isExpanded ? 'false' : 'true');
          return;
        }

        gsap.killTweensOf(desc);
        const startHeight = desc.getBoundingClientRect().height;
        desc.classList.add('animating');
        desc.style.height = `${startHeight}px`;

        if (!isExpanded) {
          const targetHeight = desc.scrollHeight;
          moreLabel.textContent = 'Show less';
          more.setAttribute('aria-expanded', 'true');
          gsap.fromTo(desc,
            {height:startHeight, opacity:.86},
            {height:targetHeight, opacity:1, duration:.38, ease:'power2.out', onComplete:() => {
              desc.classList.remove('animating');
              desc.classList.add('expanded');
              desc.style.height = '';
              desc.style.opacity = '';
            }}
          );
        } else {
          const lineHeight = parseFloat(getComputedStyle(desc).lineHeight) || 23.36;
          const targetHeight = lineHeight * 2;
          moreLabel.textContent = 'Show more';
          more.setAttribute('aria-expanded', 'false');
          gsap.to(desc, {height:targetHeight, opacity:.88, duration:.32, ease:'power2.inOut', onComplete:() => {
            desc.classList.remove('animating');
            desc.classList.remove('expanded');
            desc.style.height = '';
            desc.style.opacity = '';

    });

  function normalizeText(value){
    return (value || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,' ')
      .trim();
  }

  function levenshtein(a,b){
    if(a===b) return 0;
    if(!a.length) return b.length;
    if(!b.length) return a.length;
    const prev = Array.from({length:b.length+1},(_,i)=>i);
    for(let i=1;i<=a.length;i++){
      let last = prev[0];
      prev[0]=i;
      for(let j=1;j<=b.length;j++){
        const old = prev[j];
        const cost = a[i-1]===b[j-1] ? 0 : 1;
        prev[j]=Math.min(prev[j]+1, prev[j-1]+1, last+cost);
        last=old;
      }
    }
    return prev[b.length];
  }

  function allowedDistance(token){
    if(token.length <= 4) return 0;
    if(token.length <= 7) return 1;
    return 2;
  }

  function tokenMatches(queryToken, candidateToken){
    if(queryToken === candidateToken) return true;
    // Allow useful partial searches, but only from the beginning of a word.
    if(queryToken.length >= 3 && candidateToken.startsWith(queryToken)) return true;
    // Typo tolerance is intentionally conservative: similar word length + small edit distance.
    if(Math.abs(queryToken.length - candidateToken.length) > 1) return false;
    return levenshtein(queryToken,candidateToken) <= allowedDistance(queryToken);
  }

  function fuzzyTextMatch(query, text){
    const q = normalizeText(query);
    const hay = normalizeText(text);
    if(!q) return true;
    if(hay.includes(q)) return true;
    const qTokens = q.split(/\s+/).filter(Boolean);
    const hTokens = hay.split(/\s+/).filter(Boolean);
    return qTokens.every(qt => hTokens.some(ht => tokenMatches(qt,ht)));
  }

  function fuzzyLabelScore(query,label){
    const q = normalizeText(query);
    const l = normalizeText(label);
    if(!q) return 999;
    if(l === q) return 0;
    if(l.startsWith(q)) return 0.15;
    if(l.includes(q)) return 0.25 + l.indexOf(q)/1000;
    const qTokens=q.split(/\s+/).filter(Boolean);
    const lTokens=l.split(/\s+/).filter(Boolean);
    let total=0;
    for(const qt of qTokens){
      let best=Infinity;
      for(const lt of lTokens){
        if(qt === lt) best=Math.min(best,0);
        else if(qt.length >= 3 && lt.startsWith(qt)) best=Math.min(best,0.2);
        else if(Math.abs(qt.length-lt.length) <= 1) {
          const d=levenshtein(qt,lt);
          if(d <= allowedDistance(qt)) best=Math.min(best,d/Math.max(qt.length,lt.length));
        }
      }
      if(best>0.34) return 999;
      total+=best;
    }
    return total/qTokens.length;
  }

  const correctionVocabulary = (() => {
    const words = new Set();
    rows.forEach(row => {
      const sources = [row.dataset.construct || '', row.querySelector('.measure-title')?.textContent || '', row.dataset.text || ''];
      sources.forEach(source => normalizeText(source).split(/\s+/).filter(w => w.length >= 3).forEach(w => words.add(w)));
    });
    return [...words];
  })();

  function closestWord(token){
    const t = normalizeText(token);
    if(!t || t.length < 3 || correctionVocabulary.includes(t)) return null;
    let best=null;
    let bestDistance=Infinity;
    correctionVocabulary.forEach(word => {
      if(Math.abs(word.length-t.length) > 1) return;
      const d=levenshtein(t,word);
      if(d < bestDistance){ bestDistance=d; best=word; }
    });
    return best && bestDistance <= allowedDistance(t) ? best : null;
  }

  function correctedQuery(query){
    const parts = query.trim().split(/(\s+)/);
    let changed=false;
    const changedWords=[];
    const out=parts.map(part => {
      if(/^\s+$/.test(part)) return part;
      const clean=part.replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g,'');
      if(!clean) return part;
      const replacement=closestWord(clean);
      if(!replacement || normalizeText(replacement)===normalizeText(clean)) return part;
      changed=true;
      changedWords.push({from:clean,to:replacement});
      const prefix=part.slice(0,part.indexOf(clean));
      const suffix=part.slice(part.indexOf(clean)+clean.length);
      return prefix + replacement + suffix;
    });
    return changed ? {label:out.join(''), changedWords} : null;
  }


  const AGE_BAND_BOUNDS = {'0–2':[0,2],'3–5':[3,5],'6–11':[6,11],'12–17':[12,17],'18–25':[18,25],'26–39':[26,39],'40–64':[40,64],'65+':[65,100]};
  function rowAgeBounds(row){
    const bands=(row.dataset.age || '').split('|').filter(Boolean).map(b=>AGE_BAND_BOUNDS[b]).filter(Boolean);
    if(!bands.length) return [0,100];
    return [Math.min(...bands.map(b=>b[0])), Math.max(...bands.map(b=>b[1]))];
  }

  function suggestionResultCount(term){

  function apply(resetPagination=true){

        const bHas = Number.isFinite(bc) && b.dataset.citations !== '';
        if(aHas && bHas && bc !== ac) return bc - ac;
        if(aHas !== bHas) return aHas ? -1 : 1;
        return 0;
      }
      const ay = Number(a.querySelector('.date')?.textContent) || (sortValue === 'newest' ? -Infinity : Infinity);
      const by = Number(b.querySelector('.date')?.textContent) || (sortValue === 'newest' ? -Infinity : Infinity);

    });

    rows.forEach(row=>{ row.style.display='none'; });

  function commitSearch(value = search.value, explicitCorrection = null, correctionAccepted = false){

  function escapeHtml(value){
    return value.replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  }

  function highlightMatch(label, query){
    if(!query) return `<span class="suggestion-label">${escapeHtml(label)}</span>`;
    const lower = label.toLowerCase();
    const i = lower.indexOf(query.toLowerCase());
    if(i === -1) return `<span class="suggestion-label">${escapeHtml(label)}</span>`;
    const before = escapeHtml(label.slice(0,i));
    const match = escapeHtml(label.slice(i,i+query.length));
    const after = escapeHtml(label.slice(i+query.length));
    return `<span class="suggestion-label">${before}<span class="suggestion-match">${match}</span>${after}</span>`;
  }

  function rankItems(items, query, limit=4){
    if(!query) return items.slice(0, limit);
    return items
      .map(item => ({...item, _score:fuzzyLabelScore(query,item.label)}))
      .filter(item => item._score < 0.35)
      .sort((a,b) => a._score-b._score || a.label.length-b.label.length)
      .slice(0, limit);
  }

  function groupedSuggestions(query){
    const constructs = suggestionPool.filter(item => item.type === 'construct');
    const measures = suggestionPool.filter(item => item.type === 'measure');
    const recent = getRecentSearches()
      .slice(0,4)
      .map(label => ({label, key: label.toLowerCase(), type:'recent'}));

    if(!query){
      return { correction:null, recent, constructs: [], measures: [] };
    }

    return {
      correction:null,
      recent,
      constructs: rankItems(constructs, query, 4),
      measures: rankItems(measures, query, 4)
    };
  }

  function renderCorrection(correction){
    if(!correction) return '';
    let html=escapeHtml(correction.label);
    correction.changedWords.forEach(({to}) => {
      const re=new RegExp(`\\b${to.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i');
      html=html.replace(re, m => `<span class="suggestion-match">${m}</span>`);
    });
    return `
      <div class="suggestion-group did-you-mean">
        <div class="suggestion-group-title">Did you mean?</div>
        <div class="suggestion-item active correction-item" data-query="${escapeHtml(correction.label)}" role="button" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
          <span class="suggestion-label">${html}</span>

        </div>

  }

  function renderGroup(title, items, raw, type, extraClass=''){
    if(!items.length) return '';
    return `
      <div class="suggestion-group ${extraClass}">
        <div class="suggestion-group-title">${title}</div>
        ${items.map((item,index) => `
          <div class="suggestion-item ${type === 'recent' ? 'recent-item' : ''}" data-query="${escapeHtml(item.label)}" role="button" tabindex="0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="10.75" cy="10.75" r="6.75"></circle><path d="M15.75 15.75 20 20"></path></svg>
            ${highlightMatch(item.label, raw)}
            <span class="suggestion-count">${suggestionResultCount(item.label)}</span>
            ${type === 'recent' ? `<button class="recent-remove" type="button" aria-label="Remove ${escapeHtml(item.label)} from recent searches" data-remove="${escapeHtml(item.label)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>` : ''}
          </div>`).join('')}
      </div>`;
  }

  function measureNaturalSuggestionsHeight(){
    const previousHeight = suggestions.style.height;
    const previousTransition = suggestions.style.transition;
    suggestions.style.transition = 'none';
    suggestions.style.height = 'auto';
    const natural = suggestions.getBoundingClientRect().height;
    suggestions.style.height = previousHeight;
    suggestions.style.transition = previousTransition;
    return natural;
  }

  function setSuggestionsOpen(open){
    const isOpen = suggestions.classList.contains('on');
    if(open){
      const current = isOpen ? suggestions.getBoundingClientRect().height : 0;
      if(!isOpen){
        suggestions.style.height = '0px';
        suggestions.classList.add('on');
      } else {
        suggestions.style.height = current + 'px';
      }

      const target = measureNaturalSuggestionsHeight();
      // Force the browser to acknowledge the starting height before animating.
      void suggestions.offsetHeight;
      requestAnimationFrame(() => {
        suggestions.style.height = target + 'px';
      });
    } else if(isOpen){
      const current = suggestions.getBoundingClientRect().height;
      suggestions.style.height = current + 'px';
      void suggestions.offsetHeight;
      requestAnimationFrame(() => { suggestions.style.height = '0px'; });
      const done = (event) => {
        if(event.propertyName !== 'height') return;
        if(suggestions.style.height === '0px') suggestions.classList.remove('on');
        suggestions.removeEventListener('transitionend', done);
      };
      suggestions.addEventListener('transitionend', done);
    }
  }

  function closeSuggestions(){
    setSuggestionsOpen(false);
    suggestionsBackdrop.classList.remove('on');

  function updateSuggestions(force=false){
    const raw = search.value.trim();
    const groups = groupedSuggestions(raw);
    suggestionList.innerHTML =
      renderGroup('Recent searches', groups.recent, raw, 'recent') +
      renderGroup('Constructs', groups.constructs, raw, 'construct') +
      renderGroup('Measures', groups.measures, raw, 'measure');

    suggestionList.querySelectorAll('.suggestion-item').forEach(item => {
      const run = () => commitSearch(item.dataset.query || '');
      item.addEventListener('mousedown', e => {
        if(e.target.closest('.recent-remove')) return;
        e.preventDefault();
        run();
      });
      item.addEventListener('keydown', e => {
        if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.recent-remove')){
          e.preventDefault();
          run();
        }
      });
    });

    suggestionList.querySelectorAll('.recent-remove').forEach(button => {
      button.addEventListener('mousedown', e => {
        e.preventDefault();
        e.stopPropagation();
        removeRecentSearch(button.dataset.remove || '');
        search.focus();
      });
    });

    const hasMatches = groups.recent.length || groups.constructs.length || groups.measures.length;
    const hasTypedQuery = !!raw;
    const searchFocused = document.activeElement===search;
    const showSuggestions = searchFocused && (hasTypedQuery ? hasMatches : groups.recent.length > 0);
    setSuggestionsOpen(showSuggestions);
    // Focus mode begins as soon as the search field is active, even before suggestions appear.
    suggestionsBackdrop.classList.toggle('on', searchFocused);
  }

  function clearSearch(){
    search.value = '';
    committedQuery = '';
    committedEffectiveQuery = '';
    committedCorrection = null;
    updateSearchSummary();
    apply();
    updateSuggestions(true);
    search.focus();
  }

  document.querySelector('.search-icon').addEventListener('click', ()=>commitSearch());
  searchClear.addEventListener('click', clearSearch);
  sortSegments.forEach(button => {
    button.addEventListener('click', () => {
      sortValue = button.dataset.sort || 'newest';
      sortSegments.forEach(item => {
        const active = item.dataset.sort === sortValue;
        item.classList.toggle('active', active);
        item.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      updateSortIndicator(true);
      apply();
    });
  });

  suggestionsBackdrop.addEventListener('mousedown', e => {
    e.preventDefault();
    closeSuggestions();
    search.blur();
    searchShell.classList.remove('search-active');
  });


  function activeFilterCount(){
    const facetCount = Object.values(appliedFacetState).filter(value => value !== 'Any').length;
    return facetCount + appliedAgeStages.size;
  }

  function updateFilterCount(){
    const badge = document.getElementById('filterCount');
    if(!badge) return;
    const n = activeFilterCount();
    badge.textContent = n;
    badge.classList.toggle('on', n > 0);
    badge.setAttribute('aria-label', `${n} active filter${n === 1 ? '' : 's'}`);
  }

  const filterBtn = document.getElementById('filterBtn');
  function openDrawer(){
    drawer.classList.add('on');
    document.body.classList.add('filters-open');
    drawer.setAttribute('aria-hidden','false');
    filterBtn.setAttribute('aria-expanded','true');
  }
  function closeDrawer(){
    drawer.classList.remove('on');
    document.body.classList.remove('filters-open');
    drawer.setAttribute('aria-hidden','true');
    filterBtn.setAttribute('aria-expanded','false');
  }
  filterBtn.addEventListener('click',()=>drawer.classList.contains('on') ? closeDrawer() : openDrawer());
  updateFilterCount();
  document.getElementById('applyFilters').addEventListener('click',()=>{appliedFacetState = { ...facetState }; appliedAgeStages = new Set(selectedAgeStages); updateFilterCount(); apply(); closeDrawer()});
  document.getElementById('resetFilters').addEventListener('click',()=>{Object.keys(facetState).forEach(key => facetState[key] = 'Any'); selectedAgeStages.clear(); appliedFacetState = { ...facetState }; appliedAgeStages = new Set(); renderFacetSections(); updateFilterCount(); apply();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeSuggestions();search.blur();searchShell.classList.remove('search-active');}});

  // Initialize count, sort order, and facet state after all rows are rendered.
  requestAnimationFrame(()=>updateSortIndicator(false));
  window.addEventListener('resize',()=>{ updateSortIndicator(false); });
  apply();
</script>

<script id="autoplay-demo-inline">
(() => {
  const params = new URLSearchParams(window.location.search);
  if (params.get("demo") !== "1") return;

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const norm = s => (s || "").replace(/\s+/g, " ").trim().toLowerCase();

  const style = document.createElement("style");
  style.id = "autoplay-demo-style";
  style.textContent = `
    html.autoplay-demo,
    html.autoplay-demo body,
    html.autoplay-demo body * { cursor: none !important; }

    #autoplay-demo-cursor {
      position: fixed;
      z-index: 2147483647;
      left: 0; top: 0;
      width: 28px; height: 34px;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-60px,-60px,0);
      transition: transform .72s cubic-bezier(.22,.82,.24,1), opacity .18s ease;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.18));
      will-change: transform;
    }
    #autoplay-demo-cursor.on { opacity: 1; }

    #autoplay-demo-click {
      position: fixed;
      z-index: 2147483646;
      width: 26px; height: 26px;
      margin: -13px 0 0 -13px;
      border: 1.5px solid rgba(0,0,0,.34);
      border-radius: 999px;
      pointer-events: none;
      opacity: 0;
      transform: scale(.45);
    }
    #autoplay-demo-click.go { animation: autoplayDemoClick .42s ease-out forwards; }

    @keyframes autoplayDemoClick {
      from { opacity: .65; transform: scale(.45); }
      to   { opacity: 0; transform: scale(1.7); }
    }

    #autoplay-demo-fade {
      position: fixed;
      z-index: 2147483645;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    #autoplay-demo-fade.on { opacity: 1; }
  `;
  document.head.appendChild(style);
  document.documentElement.classList.add("autoplay-demo");

  const cursor = document.createElement("div");
  cursor.id = "autoplay-demo-cursor";
  cursor.innerHTML = `
    <svg viewBox="0 0 28 34" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.2 2.2 22.1 19.1l-8.65 1.5 5.05 9.35-4.15 2.25-5.05-9.35-6.35 6.05Z"
        fill="#fff" stroke="#000" stroke-width="1.65" stroke-linejoin="round"/>
    </svg>`;
  document.body.appendChild(cursor);

  const ring = document.createElement("div");
  ring.id = "autoplay-demo-click";
  document.body.appendChild(ring);

  const fade = document.createElement("div");
  fade.id = "autoplay-demo-fade";
  document.body.appendChild(fade);

  function pointFor(el) {
    const r = el.getBoundingClientRect();
    return {
      x: r.left + Math.min(Math.max(r.width * .52, 10), Math.max(r.width - 10, 10)),
      y: r.top + Math.min(Math.max(r.height * .52, 10), Math.max(r.height - 10, 10))
    };
  }

  async function moveTo(el, ms = 720) {
    if (!el) return false;
    const p = pointFor(el);
    cursor.style.transitionDuration = `${ms}ms`;
    cursor.classList.add("on");
    cursor.style.transform = `translate3d(${p.x - 4}px,${p.y - 3}px,0)`;
    await sleep(ms + 70);
    return true;
  }

  function pulse(el) {
    const p = pointFor(el);
    ring.style.left = `${p.x}px`;
    ring.style.top = `${p.y}px`;
    ring.classList.remove("go");
    void ring.offsetWidth;
    ring.classList.add("go");
  }

  async function click(el, pause = 520) {
    if (!el) return false;
    await moveTo(el);
    pulse(el);
    el.click();
    await sleep(pause);
    return true;
  }

  function byText(selector, text, root = document) {
    const wanted = Array.isArray(text) ? text.map(norm) : [norm(text)];
    return [...root.querySelectorAll(selector)].find(el => {
      const value = norm(el.textContent);
      return wanted.some(w => value === w || value.includes(w));
    }) || null;
  }

  function facetSection(title) {
    const wanted = norm(title);
    return [...document.querySelectorAll(".facet-section")].find(section => {
      const heading = section.querySelector(".facet-title");
      return heading && norm(heading.textContent).includes(wanted);
    }) || null;
  }

  function chip(sectionTitle, labels, { allowFallback = false } = {}) {
    const section = facetSection(sectionTitle);
    if (!section) return null;
    const choices = [...section.querySelectorAll(".facet-chip,.age-chip")]
      .filter(el => !el.disabled && norm(el.textContent) !== "any");

    for (const label of labels) {
      const wanted = norm(label);
      const exact = choices.find(el => norm(el.textContent) === wanted);
      if (exact) return exact;

      const starts = choices.find(el => norm(el.textContent).startsWith(wanted));
      if (starts) return starts;

      const contains = choices.find(el => norm(el.textContent).includes(wanted));
      if (contains) return contains;
    }

    return allowFallback ? (choices[0] || null) : null;
  }

  async function revealInDrawer(el, align = "center") {
    const drawer = document.querySelector(".drawer");
    if (!drawer || !el) return;

    const drawerRect = drawer.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();

    let delta = 0;
    if (align === "bottom") {
      delta = elRect.bottom - (drawerRect.bottom - 30);
    } else {
      const drawerCenter = drawerRect.top + drawerRect.height / 2;
      const elCenter = elRect.top + elRect.height / 2;
      delta = elCenter - drawerCenter;
    }

    if (Math.abs(delta) > 8) {
      drawer.scrollTo({
        top: Math.max(0, drawer.scrollTop + delta),
        behavior: "smooth"
      });
      await sleep(900);
    }
  }

  async function clickDrawerChip(sectionTitle, labels) {
    // The site's filter renderer rebuilds its chip DOM after every selection,
    // so always resolve a fresh element immediately before interacting with it.
    const target = chip(sectionTitle, labels);
    if (!target) return false;
    await revealInDrawer(target, "center");
    return click(target, 560);
  }

  async function typeHuman(input, text) {
    await moveTo(input, 760);
    input.focus();
    input.value = "";
    input.dispatchEvent(new Event("input", { bubbles: true }));
    await sleep(350);

    for (const char of text) {
      input.value += char;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      await sleep(125 + Math.random() * 80);
    }
    await sleep(1500);
  }

  async function enter(input) {
    input.dispatchEvent(new KeyboardEvent("keydown", {
      key: "Enter", code: "Enter", keyCode: 13, which: 13,
      bubbles: true, cancelable: true
    }));
    await sleep(1800);
  }

  function findCorrection() {
    return (
      document.querySelector(".search-summary .did-you-mean-inline button") ||
      byText(".search-summary button", "meaning") ||
      byText(".suggestion-item", "meaning")
    );
  }

  function findMLQ() {
    return [...document.querySelectorAll(".measure-title-link,.measure-title,a,button")]
      .find(el => {
        const t = norm(el.textContent);
        return t.includes("meaning in life questionnaire") ||
               t.includes("meaning in life question");
      }) || null;
  }

  async function scrollDetail() {
    const detail = document.querySelector(".detail-view");
    if (!detail) return;

    detail.scrollTop = 0;
    await sleep(900);

    const max = Math.max(0, detail.scrollHeight - detail.clientHeight);
    const duration = 9000;
    const start = performance.now();

    await new Promise(resolve => {
      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        detail.scrollTop = max * e;
        if (t < 1) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });
  }

  async function cursorOffscreen() {
    cursor.style.transitionDuration = "650ms";
    cursor.style.transform =
      `translate3d(${window.innerWidth - 65}px,${window.innerHeight - 70}px,0)`;
    await sleep(700);
    cursor.classList.remove("on");
  }

  async function run() {
    await sleep(1000);

    cursor.classList.add("on");
    cursor.style.transform = "translate3d(68px,110px,0)";
    await sleep(650);

    const filterButton =
      document.getElementById("filterBtn") ||
      byText("button", "filter");
    await click(filterButton, 760);

    // Select the intended filters one at a time. Each click causes the site's
    // own filter UI to re-render, so the next control is found fresh.
    await clickDrawerChip("Population", ["General"]);
    await clickDrawerChip("Number of Items", ["1–10 items"]);
    await clickDrawerChip("Language", ["English"]);

    // Now scroll the real drawer all the way down until the actual Apply button
    // is comfortably visible, then click it.
    const apply =
      document.getElementById("applyFilters") ||
      byText(".filter-footer button,button", ["Apply filters", "Apply"]);

    if (apply) {
      await revealInDrawer(apply, "bottom");
      await sleep(450);
      await click(apply, 1000);
    }

    const search =
      document.querySelector(".search-input") ||
      document.querySelector('input[type="search"]');
    if (!search) throw new Error("Search input not found.");

    await typeHuman(search, "meanig");
    await enter(search);

    // Let the misspelled search and fuzzy results remain visible long enough
    // for the viewer to understand what just happened.
    await sleep(2200);

    let mlq = findMLQ();

    if (!mlq) {
      search.focus();
      search.value = "Meaning in life";
      search.dispatchEvent(new Event("input", { bubbles: true }));
      await sleep(450);
      await enter(search);
      mlq = findMLQ();
    }

    if (!mlq) throw new Error("Meaning in Life Questionnaire result not found.");

    // Give the result screen a beat before choosing the questionnaire.
    await sleep(1400);
    await click(mlq.closest("a,button,.measure-title-link") || mlq, 1150);

    await cursorOffscreen();
    await scrollDetail();

    await sleep(1300);
    fade.classList.add("on");
    await sleep(360);
    window.location.reload();
  }

  window.addEventListener("load", () => {
    run().catch(err => {
      console.warn("[Measures autoplay demo]", err);
      cursor.classList.remove("on");
    });
  }, { once: true });
})();
</script>
